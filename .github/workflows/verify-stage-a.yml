name: Verify Stage-A Data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-stage-a:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify published Stage-A data
        run: python scripts/verify_stage_a.py
